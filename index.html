<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta -->
  <title>EQRA — কুরআন পড়ুন, বুঝুন, চিন্তা করুন</title>
  <meta name="description" content="EQRA — বাংলা ও ইংরেজিতে কুরআন পড়ুন, হাদিস জানুন, কুরআনের দোয়া শিখুন। আরবি টেক্সট, বাংলা অনুবাদ, ইংরেজি অনুবাদ এবং অডিও তেলাওয়াত।" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EQRA" />
  <meta property="og:title" content="EQRA — কুরআন পড়ুন, বুঝুন, চিন্তা করুন" />
  <meta property="og:description" content="বাংলা ও ইংরেজিতে সম্পূর্ণ কুরআন, সহীহ হাদিস এবং কুরআনের দোয়া সমগ্র।" />
  <meta property="og:locale" content="bn_BD" />
  <meta property="og:locale:alternate" content="en_US" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="EQRA — Read. Understand. Reflect." />
  
  <!-- Canonical & Alternate -->
  <link rel="canonical" href="https://eqra.com/" />
  <link rel="alternate" hreflang="bn" href="https://eqra.com/#/bn/" />
  <link rel="alternate" hreflang="en" href="https://eqra.com/#/en/" />
  <link rel="alternate" hreflang="x-default" href="https://eqra.com/#/bn/" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Google Fonts: Hind Siliguri (Bangla) + Inter (English) + Amiri + Noto Nastaliq Urdu + Gulzar -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Gulzar&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "EQRA",
    "alternateName": "ইকরা",
    "url": "https://eqra.com",
    "description": "Bilingual Quran knowledge platform in Bangla and English",
    "inLanguage": ["bn", "en", "ar"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://eqra.com/#/bn/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- App CSS -->
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body>
  <div id="app">
    <!-- Loading State -->
    <div id="app-loader" class="app-loader">
      <div class="loader-content">
        <div class="loader-logo">EQRA</div>
        <div class="loader-arabic">ٱقْرَأْ</div>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
